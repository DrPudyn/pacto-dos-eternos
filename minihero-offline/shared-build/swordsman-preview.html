<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espadachim — prévia pixel art</title><style>*{box-sizing:border-box}body{margin:0;background:#0a1421;color:#e7eaf1;font:16px Arial;min-height:100vh;display:grid;place-content:center;padding:24px}main{width:min(100%,1000px);margin:auto}h1{color:#f3d296;font-size:25px}p{color:#b5c5d4;line-height:1.6}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid #627086;background:radial-gradient(ellipse,#28404e,#101d2d);text-align:center;padding:18px}canvas{width:256px;height:256px;max-width:100%;image-rendering:pixelated}h2{font-size:17px;color:#f3d296}.controls{display:flex;gap:16px;align-items:center;justify-content:center;margin:24px}select{background:#182c40;color:#ffe5b2;padding:9px;border:1px solid #b29b62}button,a{padding:10px 18px;background:#20334b;border:1px solid #b29b62;color:#ffe5b2;text-decoration:none;font:inherit;cursor:pointer}.small canvas{width:64px;height:64px}.small{margin-top:24px;display:flex;gap:30px;justify-content:center;align-items:center}.error{color:#ffb39d}@media(max-width:700px){.cards{grid-template-columns:1fr}canvas{width:144px;height:144px}}</style></head><body><main><h1>Espadachim com armadura · escala original</h1><p>Mesmo tamanho do personagem atual. Use o seletor para conferir todas as direções. As sprites do jogo continuam preservadas.</p><div class="cards"><section class="card"><h2>Repouso</h2><canvas width="192" height="192" data-row="0"></canvas></section><section class="card"><h2>Caminhada</h2><canvas width="192" height="192" data-row="1"></canvas></section><section class="card"><h2>Ataque</h2><canvas width="192" height="192" data-row="2"></canvas></section></div><div class="small"><span>Escala pequena:</span><canvas width="192" height="192" data-row="1"></canvas><canvas width="192" height="192" data-original="true"></canvas></div><div class="controls"><label>Direção <select id="direction"><option value="0">Frente/direita · golpe à direita</option><option value="1">Frente/esquerda · golpe à esquerda</option><option value="2">Costas/direita · golpe para baixo</option><option value="3">Costas/esquerda · golpe para cima</option></select></label><button id="pause">Pausar</button><a href="/">Voltar ao jogo</a></div><p id="status"></p></main><script type="module" src="./swordsman-preview.js?v=2"></script></body></html>
