<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Roupas por raridade</title><style>*{box-sizing:border-box}body{margin:0;background:#0a1421;color:#e9edf5;font:15px Arial;padding:24px}main{max-width:1100px;margin:auto}h1{font-size:24px;color:#eed19a}p{color:#b4c6d8}.grid{display:grid;grid-template-columns:100px repeat(6,1fr);gap:8px;align-items:center}.cell{height:168px;border:1px solid var(--color);background:#152333;display:grid;place-items:end center}.heading{text-align:center;font-weight:bold;color:var(--color)}canvas{width:140px;height:150px;image-rendering:pixelated}select{padding:9px;background:#182b3c;color:#fff;margin-bottom:18px}.status{min-height:24px}</style><main><h1>Heróis atuais · roupas por raridade</h1><p>Mesmas sprites e movimentos. O espadachim é desenhado 9/8 do tamanho original, só um pouco maior. Apenas os tecidos mudam de cor.</p><select id="action" aria-label="Movimento"><option value="idle">Repouso</option><option value="walk">Caminhada</option><option value="attack">Ataque</option></select><div class="grid" id="grid"></div><p class="status" id="status">Carregando paletas…</p></main><script type="module" src="./hero-rarity-preview.js"></script></html>
